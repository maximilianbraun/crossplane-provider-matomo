apiVersion: v1
kind: Secret
metadata:
  name: matomo-user-pass
  namespace: crossplane-system
type: Opaque
stringData:
  password: "REPLACE_WITH_USER_PASSWORD"
---
apiVersion: matomo.m.crossplane.io/v1alpha1
kind: Token
metadata:
  name: ci-token
spec:
  providerConfigRef:
    name: default
  # The minted token is written here; consume it from this secret.
  writeConnectionSecretToRef:
    namespace: crossplane-system
    name: ci-token-out
  forProvider:
    userLogin: analytics-ci
    description: CI pipeline token
    expireHours: 8760
    passwordConfirmationSecretRef:
      namespace: crossplane-system
      name: matomo-user-pass
      key: password
