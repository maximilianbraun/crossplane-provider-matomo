name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CONTROLLER_IMAGE: ghcr.io/maximilianbraun/provider-matomo-controller
      PACKAGE_REPO: ghcr.io/maximilianbraun/provider-matomo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.CONTROLLER_IMAGE }}:latest

      - name: Pin controller image in package metadata
        run: |
          sed -i "s#image: .*#image: ${CONTROLLER_IMAGE}:${{ steps.tag.outputs.tag }}#" package/crossplane.yaml
          cat package/crossplane.yaml

      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          crossplane version --client

      - name: Build provider package
        run: crossplane xpkg build --package-root=package --package-file=provider-matomo.xpkg

      - name: Push provider package
        run: crossplane xpkg push -f provider-matomo.xpkg "${PACKAGE_REPO}:${{ steps.tag.outputs.tag }}"
